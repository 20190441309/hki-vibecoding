name: Deploy to GitHub Pages

# 部署走 Vercel；此 workflow 保留为 GitHub Pages 备用方案。
# 如需启用：仓库 Settings → Pages → Source 选 GitHub Actions，再手动运行本 workflow
# （或把下面的 on: 加回 push 触发）。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages (auto basePath for Next.js)
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
